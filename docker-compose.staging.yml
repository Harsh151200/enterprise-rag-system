version: '3.8'

services:
  # Staging Database Service running pgvector natively
  staging-db:
    image: pgvector/pgvector:16
    container_name: staging-rag-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: staging_password_secret
      POSTGRES_DB: enterprise_rag_staging
    volumes:
      - staging_db_data:/var/lib/postgresql/data

  # Backend Core API Service
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: staging-rag-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=staging
      # Note how we use the service name 'staging-db' as the hostname string
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:staging_password_secret@staging-db:5432/enterprise_rag_staging
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      - staging-db

  # Frontend Dashboard Interface Service
  frontend-ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: staging-rag-frontend
    ports:
      - "8501:8501"
    environment:
      # Directs frontend python workers straight to the backend container over the internal bridge network
      - BACKEND_API_URL=http://backend-api:8000
    depends_on:
      - backend-api

volumes:
  staging_db_data: