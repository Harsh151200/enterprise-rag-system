services:
  # Staging Database Service running pgvector natively
  staging-db:
    image: pgvector/pgvector:pg16
    container_name: staging-rag-db
    ports:
      - "5434:5432"
    env_file:
      - .env.staging
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - staging_db_data:/var/lib/postgresql/data
    # NEW: Healthcheck prevents the backend from crashing during database bootup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Core API Service
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: staging-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.staging
    environment:
      - APP_ENV=STAGING
      - DB_HOST=${DOCKER_DB_HOST}
      - DB_PORT=${DOCKER_DB_PORT}
    volumes:
      # NEW: Bind mount links your physical sandbox folder directly to the container
      - ./data_sandbox:/app/data_sandbox
    depends_on:
      # NEW: Forces the backend to wait until PostgreSQL passes its healthcheck
      staging-db:
        condition: service_healthy

  # Frontend Dashboard Interface Service
  frontend-ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: staging-rag-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend-api:8000
    depends_on:
      - backend-api

volumes:
  staging_db_data: