version: '3.8'

services:
  # Staging Database Service running pgvector natively
  staging-db:
    image: pgvector/pgvector:16
    container_name: staging-rag-db
    ports:
      - "5433:5432"
    env_file:
      - .env.staging
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - staging_db_data:/var/lib/postgresql/data

  # Backend Core API Service
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: staging-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.staging
    environment:
      - APP_ENV=STAGING
      # Remaps connection targets away from 127.0.0.1 onto the internal Docker service DNS name
      - DB_HOST=${DOCKER_DB_HOST}
      - DB_PORT=${DOCKER_DB_PORT}
    depends_on:
      - staging-db

  # Frontend Dashboard Interface Service
  frontend-ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: staging-rag-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend-api:8000
    depends_on:
      - backend-api

volumes:
  staging_db_data: