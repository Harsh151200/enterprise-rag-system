name: Enterprise RAG CI Pipeline

on:
  push:
    branches: [ "main", "feature/cycle3-enterprise-platform" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    name: Run Core QA Suites
    runs-on: ubuntu-latest

    # Spin up the exact same pgvector database we use in staging
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_123
          POSTGRES_DB: enterprise_rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Caches dependencies to make future runs much faster

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-backend.txt
        pip install pytest pytest-asyncio httpx

    - name: Run Pytest
      env:
        # Inject our environment contract so Pydantic builds correctly
        APP_ENV: DEVELOPMENT
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: ci_test_password_123
        DB_NAME: enterprise_rag_db
      run: |
        pytest -v